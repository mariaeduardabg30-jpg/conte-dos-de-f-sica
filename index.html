<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1e">
  <meta name="description" content="Plataforma PWA de Física com conteúdo, explicações de fórmulas e quizzes interativos.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Física">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <title>Física Interativa</title>
</head>
<body>
  <img src="Emblema Vibrante com Barras Laterais.png" alt="Emblema" class="emblema">
  <div class="strip strip-top" aria-hidden="true"></div>
  <div class="strip strip-bottom" aria-hidden="true"></div>
  <div id="app"></div>

  <script src="./js/data.js"></script>
  <script src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW falhou:', err));
      });
    }
  </script>
</body>
</html>
